# Entorno reproducible del pipeline SST (CMIP6 + ERSSTv5).
# Primer paso en cualquier maquina Linux, UNA SOLA VEZ, antes de correr run.sh:
#
#   conda env create -f environment.yml
#   bash run.sh
#
# No hace falta "conda activate smn_toe" a mano: run.sh activa el
# entorno el mismo si lo encuentra creado (ver comentario al inicio de
# run.sh). Si corres algun script suelto (sin pasar por run.sh), ahi si
# hace falta activarlo vos: "conda activate smn_toe".
#
# Incluye todo lo que scripts/00_setup_env.sh verifica (cdo, wget,
# python3, requests) mas el resto de paquetes que usan los demas
# pasos del pipeline y el notebook de graficos exploratorios.
name: smn_toe
channels:
  - conda-forge
dependencies:
  - python=3.11
  - cdo=2.1.1
  - wget
  - git
  - netcdf4
  - numpy
  - pandas
  - xarray
  - matplotlib
  - requests
  - jupyterlab
  - pyyaml
  - cartopy
  - pip
  - pip:
      - cdsapi
