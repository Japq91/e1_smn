# Entorno reproducible del pipeline SST (CMIP6 + ERSSTv5).
# Primer paso en cualquier maquina Linux, ANTES de correr run.sh:
#
#   conda env create -f environment.yml
#   conda activate e1_smn
#   bash run.sh
#
# Incluye todo lo que scripts/00_setup_env.sh verifica (cdo, wget,
# python3, requests) mas el resto de paquetes que usan los demas
# pasos del pipeline y el notebook de graficos exploratorios.
name: e1_smn
channels:
  - conda-forge
dependencies:
  - python=3.11
  - cdo=2.1.1
  - wget
  - git
  - netcdf4
  - numpy
  - pandas
  - xarray
  - matplotlib
  - requests
  - jupyterlab
  - pip
  - pip:
      - cdsapi
